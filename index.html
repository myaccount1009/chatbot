<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>নাগরিক সেবা পোর্টাল</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;700&family=Anek+Bangla:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <a class="brand" href="#"><span class="mark"></span>নাগরিক সেবা</a>
    <nav><a href="#services">সেবাসমূহ</a><a href="#jobs">নিয়োগ</a><a href="#track">আবেদন ট্র্যাক</a></nav>
  </div>
</header>

<main>
  <section class="hero">
    <div class="wrap">
      <h1>সরকারি সেবা,<br>এক জায়গা থেকেই।</h1>
      <p>আপনার প্রয়োজনীয় সেবা খুঁজুন, ঘরে বসে আবেদন করুন, আবেদনের অবস্থা দেখুন।</p>
      <div class="search">
        <input id="q" type="search" placeholder="সেবার নাম লিখুন, যেমন: জন্ম নিবন্ধন" aria-label="সেবা খুঁজুন">
      </div>
    </div>
  </section>

  <section id="services" class="wrap block">
    <div class="chips" id="chips"></div>
    <div class="grid" id="list" aria-live="polite"></div>
  </section>

  <section id="jobs" class="wrap block">
    <h2>নিয়োগ বিজ্ঞপ্তি</h2>
    <div class="grid" id="jobList" aria-live="polite"></div>
  </section>

  <section id="track" class="wrap block">
    <h2>আবেদনের অবস্থা দেখুন</h2>
    <form id="trackForm" class="inline">
      <input id="code" placeholder="ট্র্যাকিং কোড, যেমন: NS1A2B3C4D" required>
      <button class="btn">অবস্থা দেখুন</button>
    </form>
    <p id="trackResult" class="result" role="status"></p>
  </section>
</main>

<dialog id="dlg">
  <form id="applyForm" method="dialog">
    <h3 id="dlgTitle"></h3>
    <p id="dlgMeta" class="meta"></p>
    <label>পূর্ণ নাম <input name="name" required></label>
    <label>মোবাইল নম্বর <input name="phone" inputmode="tel" pattern="01[3-9][0-9]{8}" placeholder="01XXXXXXXXX" required></label>
    <label>এনআইডি / জন্ম নিবন্ধন নম্বর <input name="nid"></label>
    <label>অতিরিক্ত তথ্য <textarea name="details" rows="3"></textarea></label>
    <p id="applyMsg" class="result" role="status"></p>
    <div class="actions">
      <button type="button" class="btn ghost" id="cancel">বাতিল</button>
      <button class="btn" id="submitBtn">আবেদন জমা দিন</button>
    </div>
  </form>
</dialog>

<dialog id="jobDlg">
  <form id="jobForm" method="dialog">
    <h3 id="jobTitle"></h3>
    <p id="jobMeta" class="meta"></p>
    <label>পূর্ণ নাম <input name="name" required></label>
    <label>মোবাইল নম্বর <input name="phone" inputmode="tel" pattern="01[3-9][0-9]{8}" placeholder="01XXXXXXXXX" required></label>
    <label>ইমেইল <input name="email" type="email"></label>
    <label>সর্বশেষ শিক্ষাগত যোগ্যতা <input name="education" required></label>
    <label>সিভি লিংক (Google Drive ইত্যাদি) <input name="cv" type="url" placeholder="https://"></label>
    <p id="jobMsg" class="result" role="status"></p>
    <div class="actions">
      <button type="button" class="btn ghost" id="jobCancel">বাতিল</button>
      <button class="btn" id="jobSubmit">আবেদন জমা দিন</button>
    </div>
  </form>
</dialog>

<footer><div class="wrap">© নাগরিক সেবা পোর্টাল — ডেমো প্রকল্প</div></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
<script>
/* ===== সহায়তা চ্যাটবট ===== */

// ★★★ এখানে আপনার Webhook URL বসাবেন (দুই কোটেশনের ভেতরে) ★★★
const WEBHOOK_URL = "https://n8n-f2ty.srv1670697.hstgr.cloud/webhook/c4582db6-0e63-4a71-9bbb-e9ef247195af";
// ★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★

// নোটিফিকেশন সেটিং
const NOTIFY_TEXT = "আপনার কি সাহায্য প্রয়োজন?";
const NOTIFY_DELAY = 2000; // কত মিলিসেকেন্ড পর বাবল দেখাবে (২০০০ = ২ সেকেন্ড)

(function () {
  const css = `
  #sohayota-btn{position:fixed;bottom:20px;right:20px;width:60px;height:60px;border-radius:50%;
    background:#006a4e;color:#fff;border:none;font-size:28px;cursor:pointer;z-index:9999;
    box-shadow:0 4px 12px rgba(0,0,0,.3)}

  /* লাল ডট */
  #sohayota-dot{position:fixed;bottom:62px;right:20px;width:16px;height:16px;border-radius:50%;
    background:#e53935;border:2px solid #fff;z-index:10000;display:none;pointer-events:none}
  #sohayota-dot.show{display:block;animation:sh-pulse 1.6s infinite}
  @keyframes sh-pulse{
    0%{box-shadow:0 0 0 0 rgba(229,57,53,.7)}
    70%{box-shadow:0 0 0 10px rgba(229,57,53,0)}
    100%{box-shadow:0 0 0 0 rgba(229,57,53,0)}
  }

  /* নোটিফিকেশন বাবল */
  #sohayota-notify{position:fixed;bottom:30px;right:92px;background:#fff;color:#222;
    padding:10px 30px 10px 14px;border-radius:12px;font-size:14px;line-height:1.4;
    box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:9999;cursor:pointer;display:none;
    max-width:calc(100vw - 120px);font-family:inherit}
  #sohayota-notify.show{display:block;animation:sh-pop .35s ease}
  #sohayota-notify::after{content:"";position:absolute;right:-7px;top:50%;margin-top:-7px;
    border-left:8px solid #fff;border-top:7px solid transparent;border-bottom:7px solid transparent}
  #sohayota-notify-x{position:absolute;top:2px;right:8px;font-size:16px;color:#888;cursor:pointer}
  @keyframes sh-pop{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:translateX(0)}}

  #sohayota-box{position:fixed;bottom:90px;right:20px;width:340px;max-width:calc(100vw - 40px);
    height:460px;max-height:70vh;background:#fff;border-radius:12px;display:none;flex-direction:column;
    z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,.3);overflow:hidden;font-family:inherit}
  #sohayota-box.open{display:flex}
  #sohayota-head{background:#006a4e;color:#fff;padding:12px 14px;font-weight:bold;
    display:flex;justify-content:space-between;align-items:center}
  #sohayota-head span{cursor:pointer;font-size:20px}
  #sohayota-msgs{flex:1;overflow-y:auto;padding:12px;background:#f4f6f5}
  .sh-msg{max-width:80%;padding:8px 12px;border-radius:12px;margin-bottom:8px;
    white-space:pre-wrap;word-wrap:break-word;font-size:14px;line-height:1.5}
  .sh-bot{background:#fff;border:1px solid #ddd;margin-right:auto}
  .sh-user{background:#006a4e;color:#fff;margin-left:auto}
  #sohayota-form{display:flex;border-top:1px solid #ddd}
  #sohayota-input{flex:1;border:none;padding:12px;font-size:14px;outline:none}
  #sohayota-send{background:#006a4e;color:#fff;border:none;padding:0 16px;cursor:pointer;font-size:14px}
  `;
  const style = document.createElement("style");
  style.textContent = css;
  document.head.appendChild(style);

  const wrap = document.createElement("div");
  wrap.innerHTML = `
    <div id="sohayota-notify">
      <span id="sohayota-notify-text"></span>
      <span id="sohayota-notify-x">×</span>
    </div>
    <button id="sohayota-btn" title="সহায়ক">💬</button>
    <div id="sohayota-dot"></div>
    <div id="sohayota-box">
      <div id="sohayota-head">সহায়ক <span id="sohayota-close">×</span></div>
      <div id="sohayota-msgs"></div>
      <div id="sohayota-form">
        <input id="sohayota-input" type="text" placeholder="আপনার প্রশ্ন লিখুন..." />
        <button id="sohayota-send">পাঠান</button>
      </div>
    </div>`;
  document.body.appendChild(wrap);

  const box = document.getElementById("sohayota-box");
  const msgs = document.getElementById("sohayota-msgs");
  const input = document.getElementById("sohayota-input");
  const dot = document.getElementById("sohayota-dot");
  const notify = document.getElementById("sohayota-notify");
  document.getElementById("sohayota-notify-text").textContent = NOTIFY_TEXT;

  let sessionId = localStorage.getItem("sohayota_session");
  if (!sessionId) {
    sessionId = "s_" + Math.random().toString(36).slice(2) + Date.now();
    localStorage.setItem("sohayota_session", sessionId);
  }

  /* ---- নোটিফিকেশন ও লাল ডট ---- */
  function showNotify() {
    if (box.classList.contains("open")) return;
    dot.classList.add("show");
    notify.classList.add("show");
  }
  function hideNotify() {
    dot.classList.remove("show");
    notify.classList.remove("show");
  }

  // পেজ লোডের কিছুক্ষণ পর দেখাবে
  setTimeout(showNotify, NOTIFY_DELAY);

  // শুধু বাবল বন্ধ (লাল ডট থেকে যাবে)
  document.getElementById("sohayota-notify-x").onclick = (e) => {
    e.stopPropagation();
    notify.classList.remove("show");
  };

  function openChat() {
    box.classList.add("open");
    hideNotify();
    input.focus();
  }

  function addMsg(text, who) {
    const d = document.createElement("div");
    d.className = "sh-msg " + (who === "user" ? "sh-user" : "sh-bot");
    d.textContent = text;
    msgs.appendChild(d);
    msgs.scrollTop = msgs.scrollHeight;
    return d;
  }

  addMsg("আসসালামু আলাইকুম! আমি সহায়ক। আপনাকে কীভাবে সাহায্য করতে পারি?", "bot");

  async function send() {
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    addMsg(text, "user");

    if (!WEBHOOK_URL) {
      addMsg("চ্যাটবট এখনো সংযুক্ত করা হয়নি।", "bot");
      return;
    }

    const loading = addMsg("লিখছি...", "bot");
    try {
      const res = await fetch(WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, sessionId: sessionId }),
      });
      const raw = await res.text();
      let reply = raw;
      try {
        const j = JSON.parse(raw);
        reply = j.output || j.reply || j.message || j.text || j.response || raw;
      } catch (e) {}
      loading.textContent = reply || "দুঃখিত, কোনো উত্তর পাওয়া যায়নি।";
    } catch (err) {
      loading.textContent = "দুঃখিত, সংযোগে সমস্যা হয়েছে। আবার চেষ্টা করুন।";
    }
    msgs.scrollTop = msgs.scrollHeight;
  }

  document.getElementById("sohayota-btn").onclick = () => {
    box.classList.contains("open") ? box.classList.remove("open") : openChat();
  };
  notify.onclick = openChat; // বাবলে ক্লিক করলেও চ্যাট খুলবে
  document.getElementById("sohayota-close").onclick = () => box.classList.remove("open");
  document.getElementById("sohayota-send").onclick = send;
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
})();
</script>
</body>
</html>
